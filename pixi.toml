[workspace]
authors = ["saalineo <aliarif1168@gmail.com>"]
channels = ['https://conda.modular.com/max', 'conda-forge']
name = "difpatch"
platforms = ['linux-64']
version = "0.1.0"

[tasks]
test = "python3 tests/run_all.py"
test_oracle = "mojo run -I src -I tests tests/test_oracle.mojo"
test_tokenize = "mojo run -I src -I tests tests/test_tokenize.mojo"
test_myers = "mojo run -I src -I tests tests/test_myers.mojo"
test_patch = "mojo run -I src -I tests tests/test_patch.mojo"
test_roundtrip = "mojo run -I src -I tests tests/test_roundtrip.mojo"
bench = "mkdir -p build && mojo build -I src -I tests tools/bench.mojo -o build/bench && build/bench"
build_cli = "mkdir -p build && mojo build -I src src/cli.mojo -o build/difpatch"
crosscheck = "python3 tools/crosscheck.py --difpatch build/difpatch"

[dependencies]
mojo = "==1.2.0"
